<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- GPU chip body -->
  <rect x="4" y="4" width="16" height="16" rx="2" ry="2"
        fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Connector pins top -->
  <line x1="7"  y1="4" x2="7"  y2="2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="4" x2="12" y2="2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="4" x2="17" y2="2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Connector pins bottom -->
  <line x1="7"  y1="20" x2="7"  y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="20" x2="12" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="20" x2="17" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ascending bar chart inside chip -->
  <rect x="7"  y="15" width="2" height="4" rx="0.5" fill="#ffffff"/>
  <rect x="11" y="12" width="2" height="7" rx="0.5" fill="#ffffff"/>
  <rect x="15" y="9"  width="2" height="10" rx="0.5" fill="#ffffff"/>
</svg>
